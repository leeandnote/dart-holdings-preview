name: Daily Lee&Note publish

on:
  schedule:
    # 20:10 KST (11:10 UTC). Runs in GitHub even when the local PC is off.
    - cron: "10 11 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in yyyyMMdd. Empty uses today's KST date."
        required: false
        type: string
      send_telegram:
        description: "Send the 3-image Telegram album. Scheduled runs always send it."
        required: false
        default: false
        type: boolean
      post_x:
        description: "Post the 3-image bundle to X."
        required: false
        default: true
        type: boolean
      post_threads:
        description: "Post the 3-image bundle to Threads."
        required: false
        default: true
        type: boolean
      post_instagram:
        description: "Post the 3-image carousel to Instagram."
        required: false
        default: true
        type: boolean
      post_youtube:
        description: "Upload the 3-card vertical video to YouTube Shorts."
        required: false
        default: false
        type: boolean
      render_youtube_only:
        description: "Render and validate the YouTube video without uploading it."
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-leeandnote-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_OAUTH1_ACCESS_TOKEN: ${{ secrets.X_OAUTH1_ACCESS_TOKEN }}
      X_OAUTH1_ACCESS_TOKEN_SECRET: ${{ secrets.X_OAUTH1_ACCESS_TOKEN_SECRET }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CONFIG_TOML_B64: ${{ secrets.WRANGLER_CONFIG_TOML_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore Cloudflare authentication
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WRANGLER_CONFIG_TOML_B64)) {
            $configPath = Join-Path $HOME ".config/.wrangler/config/default.toml"
            New-Item -ItemType Directory -Path (Split-Path -Parent $configPath) -Force | Out-Null
            [IO.File]::WriteAllBytes($configPath, [Convert]::FromBase64String($env:WRANGLER_CONFIG_TOML_B64))
          }

      - name: Resolve KST report date
        shell: pwsh
        run: |
          $inputDate = "${{ inputs.report_date }}"
          if ([string]::IsNullOrWhiteSpace($inputDate)) {
            $inputDate = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9)).ToString("yyyyMMdd")
          }
          "REPORT_DATE=$inputDate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish after data health check
        shell: pwsh
        run: |
          $args = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", ".\daily_blog_publish_after_check.ps1",
            "-ReportDate", $env:REPORT_DATE,
            "-BackfillDays", "8",
            "-PublishDays", "120"
          )
          $sendTelegram = "${{ github.event_name }}" -eq "schedule" -or "${{ inputs.send_telegram }}" -eq "true"
          if ($sendTelegram -or "${{ inputs.post_x }}" -ne "false" -or "${{ inputs.post_threads }}" -ne "false" -or "${{ inputs.post_instagram }}" -ne "false" -or "${{ inputs.post_youtube }}" -eq "true") {
            $args += "-SendSocialCards"
          }
          if ("${{ inputs.post_x }}" -ne "false") { $args += "-PostXCards" }
          if ("${{ inputs.post_threads }}" -ne "false") { $args += "-PostThreadsCards" }
          if ("${{ inputs.post_instagram }}" -ne "false") { $args += "-PostInstagramCards" }
          if ("${{ inputs.post_youtube }}" -eq "true") { $args += "-PostYouTubeShort" }
          & pwsh @args

      - name: Validate YouTube Short rendering
        if: ${{ inputs.render_youtube_only == true }}
        shell: pwsh
        run: |
          $output = & node ./send_daily_social_cards.mjs $env:REPORT_DATE --dry-run --youtube --keep | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $output.youtubeVideo)) {
            throw "Rendered YouTube video was not created."
          }
          & ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of default=noprint_wrappers=1 $output.youtubeVideo
