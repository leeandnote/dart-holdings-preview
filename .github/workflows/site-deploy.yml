name: Deploy Lee&Note site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leeandnote-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CONFIG_TOML_B64: ${{ secrets.WRANGLER_CONFIG_TOML_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Cloudflare authentication
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WRANGLER_CONFIG_TOML_B64)) {
            $configPath = Join-Path $HOME ".config/.wrangler/config/default.toml"
            New-Item -ItemType Directory -Path (Split-Path -Parent $configPath) -Force | Out-Null
            [IO.File]::WriteAllBytes($configPath, [Convert]::FromBase64String($env:WRANGLER_CONFIG_TOML_B64))
          }

      - name: Build site output
        run: node prepare_cloudflare_pages.mjs --days=120

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy public_dist --project-name leeandnote --branch main
