name: Deploy Lee&Note site

on:
  workflow_dispatch:
    inputs:
      published_only:
        description: "Publish reviewed series notes while preserving existing daily articles; do not recollect disclosures."
        type: boolean
        default: false
  schedule:
    - cron: '0 22 * * *'
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "prepare_cloudflare_pages.mjs"
      - "channel_menu.mjs"
      - "renewal_layout.mjs"
      - "renewal_article.mjs"
      - "renewal_search.mjs"
      - "renewal_discovery.mjs"
      - "renewal_charts.mjs"
      - "renewal_extended_charts.mjs"
      - "renewal_extended_charts.test.mjs"
      - "renewal_data.mjs"
      - "related_articles.mjs"
      - "institution_gate.mjs"
      - "retire_disclosurepedia.mjs"
      - "retirement_related.test.mjs"
      - "search_feed.mjs"
      - "draft_daily_question.mjs"
      - "site_metadata.mjs"
      - "home_search.mjs"
      - "glossary_detail.mjs"
      - "blog_editorial.mjs"
      - "search_guides.mjs"
      - "institution_topics.mjs"
      - "capital_guides.mjs"
      - "rights_offering_guide.mjs"
      - "insight_thumbnails.mjs"
      - "renewal_editor.mjs"
      - "daily_context.mjs"
      - "content/notes.enc.json"
      - "private_notes.mjs"
      - "note_series.mjs"
      - "series_pages.mjs"
      - "series_covers.mjs"
      - "check_note_queue.mjs"
      - "preserve_published_articles.mjs"
      - "issue_quality.mjs"
      - "disclosure_questions.mjs"
      - "daily_content.mjs"
      - "term_pages.mjs"
      - "search_graph.mjs"
      - "canonical_routes.mjs"
      - "blog_discovery.mjs"
      - "search_sitemaps.mjs"
      - "notify_indexnow.mjs"
      - "search_foundation.mjs"
      - "generate_disclosurepedia.mjs"
      - "company_news.mjs"
      - "generate_daily_blog.mjs"
      - "generate_blog_archive.mjs"
      - "generate_issue_analysis.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/site-deploy.yml"

permissions:
  contents: read

concurrency:
  group: leeandnote-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CONFIG_TOML_B64: ${{ secrets.WRANGLER_CONFIG_TOML_B64 }}
      NOTES_ARCHIVE_KEY: ${{ secrets.NOTES_ARCHIVE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Cloudflare authentication
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WRANGLER_CONFIG_TOML_B64)) {
            $configPath = Join-Path $HOME ".config/.wrangler/config/default.toml"
            New-Item -ItemType Directory -Path (Split-Path -Parent $configPath) -Force | Out-Null
            [IO.File]::WriteAllBytes($configPath, [Convert]::FromBase64String($env:WRANGLER_CONFIG_TOML_B64))
          }

      - name: Restore private series manuscripts
        run: node private_notes.mjs

      - name: Rebuild recent daily blog pages
        if: github.event_name != 'schedule' && inputs.published_only != true
        shell: pwsh
        run: |
          $kstToday = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9)).Date
          for ($i = 0; $i -lt 30; $i++) {
            $reportDate = $kstToday.AddDays(-$i).ToString("yyyyMMdd")
            Write-Host "Generating daily blog pages for $reportDate"
            & node generate_daily_blog.mjs $reportDate
            if ($LASTEXITCODE -ne 0) { throw "Daily blog generation failed for $reportDate" }
          }

      - name: Refresh recent blog archive
        if: github.event_name != 'schedule' && inputs.published_only != true
        run: node generate_blog_archive.mjs --days=30

      - name: Refresh search-led issue analysis
        if: github.event_name != 'schedule' && inputs.published_only != true
        run: node generate_issue_analysis.mjs

      - name: Preserve published articles for morning series release
        if: github.event_name == 'schedule' || inputs.published_only == true
        run: node preserve_published_articles.mjs

      - name: Check private editorial queue
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
        run: node check_note_queue.mjs --notify

      - name: Build site output
        run: node prepare_cloudflare_pages.mjs --days=120

      - name: Prepare private editorial draft
        run: node draft_daily_question.mjs

      - name: Save draft for human review
        uses: actions/upload-artifact@v4
        with:
          name: editorial-draft
          path: editorial-drafts/*.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        # Validate search entry points before public deployment.
        run: |
          node --test search-questions.test.mjs
          node --test search-integrity.test.mjs
          node --test search_feed.test.mjs channel_menu.test.mjs
          node --test search-expansion.test.mjs
          node --test renewal_layout.test.mjs renewal_article.test.mjs retirement_related.test.mjs
          node --test renewal_search.test.mjs renewal_discovery.test.mjs renewal_charts.test.mjs
          node --test renewal_extended_charts.test.mjs
          node --test renewal_qa.test.mjs
          node --test daily_context.test.mjs
          node --test renewal_data.test.mjs
          node --test note_series.test.mjs series_integration.test.mjs
          node verify-search-pages.mjs
          pnpm dlx wrangler pages deploy public_dist --project-name leeandnote --branch main

      - name: Notify IndexNow after deployment
        run: node notify_indexnow.mjs
