name: Deploy Lee&Note site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "prepare_cloudflare_pages.mjs"
      - "site_metadata.mjs"
      - "generate_daily_blog.mjs"
      - "generate_blog_archive.mjs"
      - "generate_issue_analysis.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/site-deploy.yml"

permissions:
  contents: read

concurrency:
  group: leeandnote-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CONFIG_TOML_B64: ${{ secrets.WRANGLER_CONFIG_TOML_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Cloudflare authentication
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WRANGLER_CONFIG_TOML_B64)) {
            $configPath = Join-Path $HOME ".config/.wrangler/config/default.toml"
            New-Item -ItemType Directory -Path (Split-Path -Parent $configPath) -Force | Out-Null
            [IO.File]::WriteAllBytes($configPath, [Convert]::FromBase64String($env:WRANGLER_CONFIG_TOML_B64))
          }

      - name: Rebuild recent daily blog pages
        shell: pwsh
        run: |
          $kstToday = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9)).Date
          for ($i = 0; $i -lt 30; $i++) {
            $reportDate = $kstToday.AddDays(-$i).ToString("yyyyMMdd")
            Write-Host "Generating daily blog pages for $reportDate"
            & node generate_daily_blog.mjs $reportDate
            if ($LASTEXITCODE -ne 0) { throw "Daily blog generation failed for $reportDate" }
          }

      - name: Refresh recent blog archive
        run: node generate_blog_archive.mjs --days=30

      - name: Refresh search-led issue analysis
        run: node generate_issue_analysis.mjs

      - name: Build site output
        run: node prepare_cloudflare_pages.mjs --days=120

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy public_dist --project-name leeandnote --branch main
