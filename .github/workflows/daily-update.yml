name: Daily DART data update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or intraday"
        required: false
        default: "daily"
  schedule:
    # KST 09:05-17:35 every 30 minutes on weekdays. Text-only intraday Telegram alert.
    # Avoid exact :00/:30 because GitHub scheduled workflows can be delayed or skipped at peak minutes.
    - cron: "5,35 0-8 * * 1-5"
    # KST 22:00 on weekdays. Full site/price/image briefing.
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-dart-data-update
  cancel-in-progress: false

jobs:
  intraday-alert:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '5,35 0-8 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'intraday') }}
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send intraday Telegram text alerts
        shell: pwsh
        timeout-minutes: 5
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $PSDefaultParameterValues["Invoke-WebRequest:SslProtocol"] = "Tls12"
          if (-not $env:DART_API_KEY) {
            throw "Missing repository secret: DART_API_KEY"
          }
          ./intraday_alert.ps1 -ApiKey $env:DART_API_KEY -BotToken $env:TELEGRAM_BOT_TOKEN -ChatId $env:TELEGRAM_CHAT_ID

      - name: Commit intraday alert state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/intraday_alert_state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update intraday alert state"
            git pull --rebase
            git push
          } else {
            Write-Host "No intraday state changes."
          }

  update-and-deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'intraday') || github.event.schedule == '0 13 * * 1-5' }}
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DART and price update
        shell: pwsh
        timeout-minutes: 18
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $PSDefaultParameterValues["Invoke-WebRequest:SslProtocol"] = "Tls12"
          if (-not $env:DART_API_KEY) {
            throw "Missing repository secret: DART_API_KEY"
          }
          if ("${{ github.event_name }}" -eq "schedule" -and (Test-Path "site/data/latest.json")) {
            $latest = Get-Content "site/data/latest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
            $generatedStamp = if ($latest.generatedAtUtc) { [string]$latest.generatedAtUtc } else { [string]$latest.generatedAt }
            if ($generatedStamp) {
              $generatedAt = [DateTimeOffset]::Parse($generatedStamp)
              $ageMinutes = ([DateTimeOffset]::Now - $generatedAt).TotalMinutes
              if ($ageMinutes -lt 120) {
                Write-Host "Recent cache already generated $([Math]::Round($ageMinutes, 1)) minutes ago. Skipping fallback schedule run."
                exit 0
              }
            }
          }
          ./daily_update.ps1 -ApiKey $env:DART_API_KEY -RefreshLookbackDays 0 -ObligationMaxRows 80 -PriceRecentDays 7 -PriceSleepMs 120
          if (Test-Path "site/data/prices.json") {
            Remove-Item "site/data/prices.json" -Force
          }
          $latest = Get-Content "site/data/latest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "Latest cache generatedAt: $($latest.generatedAt); rows: $($latest.rows.Count)"

      - name: Prepare SEO files
        shell: pwsh
        run: |
          $siteUrl = "${{ vars.SITE_URL }}"
          if (-not $siteUrl) {
            $siteUrl = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          if (-not $siteUrl.EndsWith("/")) {
            $siteUrl = "$siteUrl/"
          }
          $today = Get-Date -Format "yyyy-MM-dd"
          @(
            "User-agent: *",
            "Allow: /",
            "",
            "Sitemap: ${siteUrl}sitemap.xml"
          ) | Set-Content -Path "site/robots.txt" -Encoding UTF8

          @(
            "<?xml version=""1.0"" encoding=""UTF-8""?>",
            "<urlset xmlns=""http://www.sitemaps.org/schemas/sitemap/0.9"">",
            "  <url>",
            "    <loc>${siteUrl}</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>1.0</priority>",
            "  </url>",
            "  <url>",
            "    <loc>${siteUrl}blog.html</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>0.7</priority>",
            "  </url>",
            "  <url>",
            "    <loc>${siteUrl}prices.html</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>0.5</priority>",
            "  </url>",
            "  <url>",
            "    <loc>${siteUrl}disclaimer.html</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>0.4</priority>",
            "  </url>",
            "  <url>",
            "    <loc>${siteUrl}privacy.html</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>0.3</priority>",
            "  </url>",
            "  <url>",
            "    <loc>${siteUrl}terms.html</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>0.3</priority>",
            "  </url>",
            "  <url>",
            "    <loc>${siteUrl}contact.html</loc>",
            "    <lastmod>${today}</lastmod>",
            "    <priority>0.3</priority>",
            "  </url>",
            "</urlset>"
          ) | Set-Content -Path "site/sitemap.xml" -Encoding UTF8

      - name: Commit updated cache
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/robots.txt site/sitemap.xml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update DART holdings cache"
            git push
          } else {
            Write-Host "No data changes to commit."
          }

      - name: Sync cache to Supabase
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if (-not $env:SUPABASE_URL) {
            Write-Host "Missing repository secret: SUPABASE_URL. Skipping Supabase sync."
            exit 0
          }
          if (-not $env:SUPABASE_SERVICE_ROLE_KEY) {
            Write-Host "Missing repository secret: SUPABASE_SERVICE_ROLE_KEY. Skipping Supabase sync."
            exit 0
          }
          node scripts/sync-supabase-cache.mjs
