name: Intraday DART text alert

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/intraday-alert.yml"
      - "intraday_alert.ps1"
  schedule:
    # KST 09:02-17:57 every 5 minutes on weekdays. Text-only Telegram alert.
    # Offset from :00/:05 to reduce GitHub schedule congestion and dropped runs.
    - cron: "2-57/5 0-8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: intraday-dart-text-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send intraday Telegram text alerts
        shell: pwsh
        timeout-minutes: 9
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if (-not $env:DART_API_KEY) {
            throw "Missing repository secret: DART_API_KEY"
          }
          if (-not $env:TELEGRAM_BOT_TOKEN) {
            throw "Missing repository secret: TELEGRAM_BOT_TOKEN"
          }
          if (-not $env:TELEGRAM_CHAT_ID) {
            $env:TELEGRAM_CHAT_ID = "@leeandnote"
          }
          Write-Host "Secrets available: DART_API_KEY=$(-not [string]::IsNullOrWhiteSpace($env:DART_API_KEY)); TELEGRAM_BOT_TOKEN=$(-not [string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN)); TELEGRAM_CHAT_ID=$(-not [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID))"
          pwsh -NoProfile -File ./intraday_alert.ps1 -ApiKey $env:DART_API_KEY -BotToken $env:TELEGRAM_BOT_TOKEN -ChatId $env:TELEGRAM_CHAT_ID -EnrichDetails

      - name: Commit intraday alert state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/intraday_alert_state.json
          $changes = git status --porcelain site/data/intraday_alert_state.json
          if ($changes) {
            git commit -m "Update intraday alert state"
            git pull --rebase
            git push
          } else {
            Write-Host "No intraday state changes."
          }
